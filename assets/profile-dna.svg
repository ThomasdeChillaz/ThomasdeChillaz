<svg width="1200" height="620" viewBox="0 0 1200 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Thomas de Chillaz - animated 3D DNA profile</title>
  <desc id="desc">A compact animated GitHub profile card with a rotating DNA-inspired helix and key information about Thomas de Chillaz.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05080D"/>
      <stop offset="0.42" stop-color="#08131D"/>
      <stop offset="1" stop-color="#101622"/>
    </linearGradient>
    <linearGradient id="redCyan" x1="80" y1="0" x2="1120" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A31F34"/>
      <stop offset="0.46" stop-color="#E25566"/>
      <stop offset="1" stop-color="#5EEAD4"/>
    </linearGradient>
    <linearGradient id="helixLine" x1="365" y1="0" x2="835" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EEAD4" stop-opacity="0.25"/>
      <stop offset="0.5" stop-color="#F8FAFC" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#E25566" stop-opacity="0.25"/>
    </linearGradient>
    <radialGradient id="helixGlow" cx="0" cy="0" r="1" gradientTransform="translate(600 284) rotate(90) scale(245 430)">
      <stop stop-color="#5EEAD4" stop-opacity="0.19"/>
      <stop offset="0.46" stop-color="#E25566" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#05080D" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="clip">
      <rect x="0" y="0" width="1200" height="620" rx="30"/>
    </clipPath>
    <style>
      .grid { opacity: .12; }
      .dash { stroke-dasharray: 8 15; animation: dash 8s linear infinite; }
      .scan { animation: scan 5.2s ease-in-out infinite; }
      .orbit { animation: orbit 15s linear infinite; transform-origin: 600px 290px; }
      .orbitReverse { animation: orbit 19s linear reverse infinite; transform-origin: 600px 290px; }
      .floatA { animation: floatA 7s ease-in-out infinite; }
      .floatB { animation: floatB 8.5s ease-in-out -2s infinite; }
      .twinkle { animation: twinkle 3.8s ease-in-out infinite; }
      .twinkle2 { animation: twinkle 4.8s ease-in-out -1.4s infinite; }
      .rung { animation: breathe 4.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .rung2 { animation: breathe 4.2s ease-in-out -1.4s infinite; transform-box: fill-box; transform-origin: center; }
      .rung3 { animation: breathe 4.2s ease-in-out -2.8s infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes dash { to { stroke-dashoffset: -160; } }
      @keyframes scan { 0%,100% { transform: translateX(-95px); opacity: 0; } 22%,72% { opacity: .85; } 50% { transform: translateX(360px); } }
      @keyframes orbit { to { transform: rotate(360deg); } }
      @keyframes floatA { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
      @keyframes floatB { 0%,100% { transform: translateY(0); } 50% { transform: translateY(8px); } }
      @keyframes twinkle { 0%,100% { opacity: .28; transform: scale(.92); } 50% { opacity: 1; transform: scale(1.08); } }
      @keyframes breathe { 0%,100% { opacity: .62; transform: scaleX(.88); } 50% { opacity: 1; transform: scaleX(1.08); } }
      @media (prefers-reduced-motion: reduce) {
        .dash,.scan,.orbit,.orbitReverse,.floatA,.floatB,.twinkle,.twinkle2,.rung,.rung2,.rung3 { animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="620" fill="url(#bg)"/>
    <rect x="1" y="1" width="1198" height="618" rx="29" stroke="#263746" stroke-width="2"/>
    <rect x="34" y="34" width="1132" height="552" rx="24" fill="#07101A" stroke="#243445"/>
    <circle cx="600" cy="284" r="280" fill="url(#helixGlow)"/>

    <g class="grid">
      <path d="M84 80H1116M84 138H1116M84 196H1116M84 254H1116M84 312H1116M84 370H1116M84 428H1116M84 486H1116M84 544H1116" stroke="#8EA3B7"/>
      <path d="M118 64V558M218 64V558M318 64V558M418 64V558M518 64V558M618 64V558M718 64V558M818 64V558M918 64V558M1018 64V558M1118 64V558" stroke="#8EA3B7"/>
    </g>

    <g transform="translate(82 78)">
      <rect width="184" height="30" rx="15" fill="#A31F34" fill-opacity=".12" stroke="#A31F34" stroke-opacity=".72"/>
      <circle cx="20" cy="15" r="4.5" fill="#E25566" class="twinkle"/>
      <text x="36" y="20" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="1.7">HEALTHCARE RESEARCH</text>
    </g>

    <g transform="translate(82 140)">
      <text x="0" y="0" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="56" font-weight="850">Thomas de Chillaz</text>
      <text x="2" y="42" fill="#A8B7C6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="560">Computational biology / oncology / healthcare AI</text>
      <rect x="0" y="75" width="384" height="58" rx="14" fill="#0B1A28" stroke="#2A4156"/>
      <rect x="0" y="75" width="6" height="58" rx="3" fill="#A31F34"/>
      <text x="24" y="99" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="850" letter-spacing="1.4">MIT CSAIL - KELLIS LAB</text>
      <text x="24" y="120" fill="#8EA3B7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Computational Biology</text>
      <rect x="0" y="154" width="384" height="58" rx="14" fill="#0B1A28" stroke="#2A4156"/>
      <rect x="0" y="154" width="6" height="58" rx="3" fill="#5EEAD4"/>
      <text x="24" y="178" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="850" letter-spacing="1.4">AIDAMS - CENTRALESUPELEC X ESSEC</text>
      <text x="24" y="199" fill="#8EA3B7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">AI, Data, and Management</text>
    </g>

    <g transform="translate(82 405)">
      <text x="0" y="0" fill="#5EEAD4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="850" letter-spacing="1.8">FOCUS</text>
      <g transform="translate(0 23)">
        <rect width="210" height="38" rx="12" fill="#101E2A" stroke="#2C4054"/>
        <circle cx="21" cy="19" r="5" fill="#5EEAD4" class="twinkle"/>
        <text x="38" y="24" fill="#E7EEF6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="760">Single-cell benchmarks</text>
      </g>
      <g transform="translate(224 23)">
        <rect width="206" height="38" rx="12" fill="#101E2A" stroke="#2C4054"/>
        <circle cx="21" cy="19" r="5" fill="#E25566" class="twinkle2"/>
        <text x="38" y="24" fill="#E7EEF6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="760">Multimodal oncology</text>
      </g>
      <g transform="translate(0 73)">
        <rect width="210" height="38" rx="12" fill="#101E2A" stroke="#2C4054"/>
        <circle cx="21" cy="19" r="5" fill="#F3A25C" class="twinkle"/>
        <text x="38" y="24" fill="#E7EEF6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="760">Dynamic bio maps</text>
      </g>
      <g transform="translate(224 73)">
        <rect width="206" height="38" rx="12" fill="#101E2A" stroke="#2C4054"/>
        <circle cx="21" cy="19" r="5" fill="#5EEAD4" class="twinkle2"/>
        <text x="38" y="24" fill="#E7EEF6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="760">Governed health AI</text>
      </g>
    </g>

