    <linearGradient id="dnaB" x1="410" y1="0" x2="920" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A31F34"/>
      <stop offset="1" stop-color="#7DD3C7"/>
    </linearGradient>
    <clipPath id="cardClip">
