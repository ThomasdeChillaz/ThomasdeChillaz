        <text x="22" y="23" fill="#F2F7FA" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" letter-spacing="1.2">MIT CSAIL / KELLIS LAB</text>
        <text x="22" y="42" fill="#8FA1B1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">genomics and health data systems</text>
      </g>

      <g transform="translate(0 198)">
