<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Thomas de Chillaz — computational biology, oncology, and healthcare AI</title>
  <desc id="desc">An animated healthcare research banner connecting DNA, cells, tissue, and clinical systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111C"/>
      <stop offset="0.56" stop-color="#0A1725"/>
      <stop offset="1" stop-color="#0D1B2C"/>
    </linearGradient>
    <linearGradient id="signal" x1="635" y1="0" x2="1135" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A31F34"/>
      <stop offset="0.48" stop-color="#E25566"/>
      <stop offset="1" stop-color="#5EEAD4"/>
    </linearGradient>
    <radialGradient id="cell" cx="0" cy="0" r="1" gradientTransform="translate(950 168) rotate(90) scale(90)">
      <stop stop-color="#5EEAD4" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="round"><rect width="1200" height="340" rx="28"/></clipPath>
    <style>
      .flow { stroke-dasharray: 7 13; animation: flow 8s linear infinite; }
      .pulse-a { animation: pulse 3.6s ease-in-out infinite; transform-origin: center; }
      .pulse-b { animation: pulse 4.2s ease-in-out -1.4s infinite; transform-origin: center; }
      .pulse-c { animation: pulse 3.8s ease-in-out -2.2s infinite; transform-origin: center; }
      .float-a { animation: floatA 7s ease-in-out infinite; }
      .float-b { animation: floatB 8s ease-in-out -2s infinite; }
      .scan { animation: scan 5.5s ease-in-out infinite; }
      @keyframes flow { to { stroke-dashoffset: -120; } }
      @keyframes pulse { 0%,100% { opacity:.38; transform:scale(.92); } 50% { opacity:1; transform:scale(1.08); } }
      @keyframes floatA { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-8px); } }
      @keyframes floatB { 0%,100% { transform:translateY(0); } 50% { transform:translateY(7px); } }
      @keyframes scan { 0%,100% { opacity:0; transform:translateX(-40px); } 25%,70% { opacity:.65; } 50% { transform:translateX(430px); } }
      @media (prefers-reduced-motion: reduce) {
        .flow,.pulse-a,.pulse-b,.pulse-c,.float-a,.float-b,.scan { animation:none; }
      }
    </style>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <path d="M0 292H1200" stroke="#16283A"/>
    <path d="M0 48H1200" stroke="#16283A"/>
    <path d="M590 0V340" stroke="#122337"/>

    <g opacity="0.17">
      <path d="M40 78H555M40 120H555M40 162H555M40 204H555M40 246H555" stroke="#8DA1B8" stroke-width="0.7"/>
      <path d="M105 48V292M190 48V292M275 48V292M360 48V292M445 48V292M530 48V292" stroke="#8DA1B8" stroke-width="0.7"/>
    </g>

    <rect x="40" y="37" width="160" height="28" rx="14" fill="#A31F34" fill-opacity="0.13" stroke="#A31F34" stroke-opacity="0.55"/>
    <circle cx="57" cy="51" r="4" fill="#E25566" class="pulse-a"/>
    <text x="70" y="56" fill="#F4F7FA" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.8">HEALTHCARE RESEARCH</text>

    <text x="40" y="125" fill="#F6F8FA" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="48" font-weight="750" letter-spacing="-1.6">Thomas de Chillaz</text>
    <text x="42" y="165" fill="#B9C7D6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="500">Computational biology · oncology · healthcare AI</text>

    <rect x="40" y="202" width="302" height="45" rx="12" fill="#0E1D2D" stroke="#263C51"/>
    <rect x="40" y="202" width="5" height="45" rx="2.5" fill="#A31F34"/>
    <text x="61" y="220" fill="#F6F8FA" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="750" letter-spacing="1.2">MIT CSAIL · KELLIS LAB</text>
    <text x="61" y="238" fill="#8FA5BA" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">Computational Biology</text>

    <text x="40" y="281" fill="#6F879D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="1.25">REPRESENTATION  ·  EVALUATION  ·  TRANSLATION</text>

    <g transform="translate(620 36)">
      <path d="M22 118C76 55 126 52 180 118C234 184 284 181 338 118C392 55 442 52 496 118" stroke="#263A4E" stroke-width="2"/>
      <path d="M22 118C76 181 126 184 180 118C234 52 284 55 338 118C392 181 442 184 496 118" stroke="#263A4E" stroke-width="2"/>

      <path d="M22 118C76 55 126 52 180 118C234 184 284 181 338 118C392 55 442 52 496 118" stroke="url(#signal)" stroke-width="3" class="flow"/>
      <path d="M22 118C76 181 126 184 180 118C234 52 284 55 338 118C392 181 442 184 496 118" stroke="url(#signal)" stroke-width="3" class="flow"/>

      <g stroke="#486077" stroke-width="1.5">
        <path d="M48 91L48 145"/><path d="M86 68L86 168"/><path d="M124 75L124 161"/>
        <path d="M162 105L162 131"/><path d="M200 142L200 94"/><path d="M238 165L238 71"/>
        <path d="M276 157L276 79"/><path d="M314 126L314 110"/><path d="M352 84L352 152"/>
        <path d="M390 68L390 168"/><path d="M428 86L428 150"/><path d="M466 124L466 112"/>
      </g>

      <g class="float-a">
        <circle cx="325" cy="199" r="83" fill="url(#cell)"/>
        <circle cx="325" cy="199" r="39" fill="#102A3A" stroke="#5EEAD4" stroke-opacity="0.72" stroke-width="2"/>
        <circle cx="325" cy="199" r="13" fill="#5EEAD4" fill-opacity="0.18" stroke="#5EEAD4"/>
        <circle cx="291" cy="181" r="7" fill="#0A1725" stroke="#5EEAD4" stroke-opacity="0.7" class="pulse-b"/>
        <circle cx="351" cy="176" r="6" fill="#0A1725" stroke="#E25566" stroke-opacity="0.8" class="pulse-c"/>
        <circle cx="356" cy="223" r="8" fill="#0A1725" stroke="#5EEAD4" stroke-opacity="0.7" class="pulse-a"/>
        <circle cx="298" cy="224" r="5" fill="#0A1725" stroke="#E25566" stroke-opacity="0.8" class="pulse-b"/>
      </g>

      <g class="float-b">
        <path d="M425 178L470 151L517 179L517 231L470 258L425 231V178Z" fill="#0C1C2B" stroke="#314A60"/>
        <path d="M470 165V244M439 184L501 223M501 184L439 223" stroke="#314A60" stroke-width="1.5"/>
        <circle cx="470" cy="151" r="6" fill="#E25566" filter="url(#glow)" class="pulse-a"/>
        <circle cx="517" cy="179" r="6" fill="#5EEAD4" filter="url(#glow)" class="pulse-b"/>
        <circle cx="517" cy="231" r="5" fill="#5EEAD4" class="pulse-c"/>
        <circle cx="470" cy="258" r="6" fill="#E25566" class="pulse-b"/>
        <circle cx="425" cy="231" r="5" fill="#5EEAD4" class="pulse-a"/>
        <circle cx="425" cy="178" r="5" fill="#E25566" class="pulse-c"/>
      </g>

      <path d="M357 199C390 199 403 204 425 205" stroke="url(#signal)" stroke-width="2" stroke-dasharray="5 8" class="flow"/>

      <rect x="14" y="270" width="510" height="1" fill="#263A4E"/>
      <rect x="14" y="269" width="62" height="3" rx="1.5" fill="url(#signal)" class="scan"/>
      <text x="14" y="292" fill="#71879B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" letter-spacing="1.4">DNA</text>
      <text x="166" y="292" fill="#71879B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" letter-spacing="1.4">CELLS</text>
      <text x="314" y="292" fill="#71879B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" letter-spacing="1.4">TISSUE</text>
      <text x="458" y="292" fill="#71879B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" letter-spacing="1.4">CARE</text>
    </g>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="338.5" rx="27.25" stroke="#24384C" stroke-width="1.5"/>
</svg>
