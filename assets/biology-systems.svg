<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Animated biology systems map</title>
  <desc id="desc">A biology-themed animated map connecting DNA, single cells, tissue, models, evaluation, and governed healthcare.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050B12"/>
      <stop offset="0.45" stop-color="#071521"/>
      <stop offset="1" stop-color="#0B1A24"/>
    </linearGradient>
    <linearGradient id="signal" x1="90" y1="0" x2="1110" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A31F34"/>
      <stop offset="0.48" stop-color="#E25566"/>
      <stop offset="1" stop-color="#5EEAD4"/>
    </linearGradient>
    <radialGradient id="cellGlow" cx="0" cy="0" r="1" gradientTransform="translate(262 294) rotate(90) scale(112)">
      <stop stop-color="#5EEAD4" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="round">
      <rect width="1200" height="520" rx="24"/>
    </clipPath>
    <style>
      .grid { opacity: 0.16; }
      .flow { stroke-dasharray: 8 14; animation: flow 8s linear infinite; }
      .fastFlow { stroke-dasharray: 4 10; animation: flow 5s linear infinite; }
      .helixA { animation: helixA 5.8s ease-in-out infinite; transform-origin: 204px 138px; }
      .helixB { animation: helixB 5.8s ease-in-out infinite; transform-origin: 204px 138px; }
      .pulse1 { animation: pulse 3.3s ease-in-out infinite; transform-origin: center; }
      .pulse2 { animation: pulse 3.8s ease-in-out -1.1s infinite; transform-origin: center; }
      .pulse3 { animation: pulse 4.2s ease-in-out -2.2s infinite; transform-origin: center; }
      .orbit { animation: orbit 9s linear infinite; transform-origin: 262px 294px; }
      .orbit2 { animation: orbit 12s linear reverse infinite; transform-origin: 262px 294px; }
      .floatA { animation: floatA 7s ease-in-out infinite; }
      .floatB { animation: floatB 8s ease-in-out -2s infinite; }
      .scan { animation: scan 5.2s ease-in-out infinite; }
      .mapPoint { animation: mapPulse 4s ease-in-out infinite; }
      .mapPoint:nth-of-type(2n) { animation-delay: -1s; }
      .mapPoint:nth-of-type(3n) { animation-delay: -2s; }
      @keyframes flow { to { stroke-dashoffset: -180; } }
      @keyframes helixA { 0%,100% { transform: translateY(0); opacity: .62; } 50% { transform: translateY(11px); opacity: 1; } }
      @keyframes helixB { 0%,100% { transform: translateY(0); opacity: 1; } 50% { transform: translateY(-11px); opacity: .62; } }
      @keyframes pulse { 0%,100% { opacity: .38; transform: scale(.88); } 50% { opacity: 1; transform: scale(1.08); } }
      @keyframes orbit { to { transform: rotate(360deg); } }
      @keyframes floatA { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
      @keyframes floatB { 0%,100% { transform: translateY(0); } 50% { transform: translateY(8px); } }
      @keyframes scan { 0%,100% { transform: translateX(-80px); opacity: 0; } 25%,70% { opacity: .88; } 50% { transform: translateX(460px); } }
      @keyframes mapPulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .flow,.fastFlow,.helixA,.helixB,.pulse1,.pulse2,.pulse3,.orbit,.orbit2,.floatA,.floatB,.scan,.mapPoint { animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="520" fill="url(#bg)"/>
    <g class="grid">
      <path d="M0 70H1200M0 140H1200M0 210H1200M0 280H1200M0 350H1200M0 420H1200" stroke="#8DA1B8" stroke-width="0.7"/>
      <path d="M90 0V520M180 0V520M270 0V520M360 0V520M450 0V520M540 0V520M630 0V520M720 0V520M810 0V520M900 0V520M990 0V520M1080 0V520" stroke="#8DA1B8" stroke-width="0.7"/>
    </g>

    <text x="54" y="58" fill="#5EEAD4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="2.2">LIVING SYSTEMS PIPELINE</text>
    <text x="54" y="101" fill="#F6F8FA" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="760">From molecular signal to governed intelligence</text>
    <text x="56" y="130" fill="#92A7B9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">DNA, cells, tissue, models, uncertainty, and clinical review moving through one accountable system.</text>

    <path d="M148 255C268 182 381 195 484 263C586 330 675 337 778 267C880 197 993 190 1082 243" stroke="#2E4356" stroke-width="4" stroke-linecap="round"/>
    <path d="M148 255C268 182 381 195 484 263C586 330 675 337 778 267C880 197 993 190 1082 243" stroke="url(#signal)" stroke-width="3" stroke-linecap="round" class="flow"/>

    <g transform="translate(58 170)">
      <text x="0" y="0" fill="#71879B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="800" letter-spacing="1.4">MOLECULAR INPUT</text>
      <path d="M30 42C68 8 104 8 142 42C180 76 216 76 254 42C292 8 328 8 366 42" stroke="#334A5E" stroke-width="2"/>
      <path d="M30 42C68 76 104 76 142 42C180 8 216 8 254 42C292 76 328 76 366 42" stroke="#334A5E" stroke-width="2"/>
      <path d="M30 42C68 8 104 8 142 42C180 76 216 76 254 42C292 8 328 8 366 42" stroke="#E25566" stroke-width="2.6" class="helixA"/>
      <path d="M30 42C68 76 104 76 142 42C180 8 216 8 254 42C292 76 328 76 366 42" stroke="#5EEAD4" stroke-width="2.6" class="helixB"/>
      <g stroke="#4C6478" stroke-width="1.3">
        <path d="M57 20V64"/><path d="M86 16V68"/><path d="M115 27V57"/><path d="M144 42V42"/>
        <path d="M173 64V20"/><path d="M202 68V16"/><path d="M231 57V27"/><path d="M260 42V42"/>
        <path d="M289 20V64"/><path d="M318 16V68"/><path d="M347 27V57"/>
      </g>
      <text x="0" y="109" fill="#8FA3B7" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12">genes -> variants -> expression -> state</text>
    </g>

    <g class="floatA">
      <circle cx="262" cy="294" r="118" fill="url(#cellGlow)"/>
      <circle cx="262" cy="294" r="61" fill="#0D2230" stroke="#5EEAD4" stroke-opacity="0.82" stroke-width="2"/>
      <circle cx="262" cy="294" r="20" fill="#5EEAD4" fill-opacity="0.16" stroke="#5EEAD4" stroke-width="1.5"/>
      <circle cx="221" cy="268" r="8" fill="#06121B" stroke="#E25566" class="pulse1"/>
      <circle cx="307" cy="262" r="7" fill="#06121B" stroke="#5EEAD4" class="pulse2"/>
      <circle cx="316" cy="324" r="10" fill="#06121B" stroke="#E25566" class="pulse3"/>
      <circle cx="228" cy="332" r="7" fill="#06121B" stroke="#5EEAD4" class="pulse2"/>
      <g class="orbit">
        <circle cx="262" cy="206" r="4" fill="#E25566" filter="url(#softGlow)"/>
      </g>
      <g class="orbit2">
        <circle cx="262" cy="379" r="4" fill="#5EEAD4" filter="url(#softGlow)"/>
      </g>
      <text x="203" y="424" fill="#71879B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="800" letter-spacing="1.5">SINGLE-CELL SIGNAL</text>
    </g>

    <g transform="translate(448 188)">
      <text x="0" y="0" fill="#71879B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="800" letter-spacing="1.4">LATENT SPACE</text>
      <rect x="0" y="24" width="268" height="214" rx="18" fill="#0A1926" stroke="#203448"/>
      <g fill="#5EEAD4" fill-opacity=".85">
        <circle class="mapPoint" cx="48" cy="89" r="4"/><circle class="mapPoint" cx="63" cy="74" r="3"/><circle class="mapPoint" cx="83" cy="97" r="3.5"/><circle class="mapPoint" cx="97" cy="79" r="3"/>
        <circle class="mapPoint" cx="74" cy="118" r="3"/><circle class="mapPoint" cx="119" cy="105" r="4"/><circle class="mapPoint" cx="133" cy="125" r="3"/>
      </g>
      <g fill="#E25566" fill-opacity=".9">
        <circle class="mapPoint" cx="169" cy="85" r="4"/><circle class="mapPoint" cx="191" cy="72" r="3"/><circle class="mapPoint" cx="211" cy="92" r="3.5"/><circle class="mapPoint" cx="201" cy="119" r="3"/>
        <circle class="mapPoint" cx="226" cy="132" r="4"/><circle class="mapPoint" cx="177" cy="133" r="3"/>
      </g>
      <g fill="#F3A25C" fill-opacity=".85">
        <circle class="mapPoint" cx="82" cy="164" r="4"/><circle class="mapPoint" cx="104" cy="178" r="3"/><circle class="mapPoint" cx="130" cy="163" r="3.5"/><circle class="mapPoint" cx="151" cy="184" r="3"/>
        <circle class="mapPoint" cx="176" cy="174" r="3"/><circle class="mapPoint" cx="199" cy="188" r="3.5"/>
      </g>
      <path d="M38 153C86 114 143 145 188 101C207 83 224 79 239 81" stroke="#6C8296" stroke-opacity=".45" stroke-width="1.5" class="fastFlow"/>
      <rect x="28" y="205" width="212" height="1" fill="#2A4054"/>
      <rect x="28" y="204" width="52" height="3" rx="1.5" fill="url(#signal)" class="scan"/>
      <text x="23" y="259" fill="#8FA3B7" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12">splits + metrics + uncertainty</text>
    </g>

    <g transform="translate(772 174)" class="floatB">
      <text x="0" y="0" fill="#71879B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="800" letter-spacing="1.4">MODEL GRAPH</text>
      <path d="M48 100L118 56L194 91L238 164L160 205L78 178Z" fill="#0A1926" stroke="#2C4256"/>
      <path d="M48 100L194 91M118 56L160 205M78 178L238 164M118 56L238 164M48 100L160 205" stroke="#2C4256" stroke-width="1.4"/>
      <circle cx="48" cy="100" r="12" fill="#0B1A24" stroke="#E25566" stroke-width="2" class="pulse1"/>
      <circle cx="118" cy="56" r="12" fill="#0B1A24" stroke="#5EEAD4" stroke-width="2" class="pulse2"/>
      <circle cx="194" cy="91" r="12" fill="#0B1A24" stroke="#F3A25C" stroke-width="2" class="pulse3"/>
      <circle cx="238" cy="164" r="12" fill="#0B1A24" stroke="#5EEAD4" stroke-width="2" class="pulse1"/>
      <circle cx="160" cy="205" r="12" fill="#0B1A24" stroke="#E25566" stroke-width="2" class="pulse2"/>
      <circle cx="78" cy="178" r="12" fill="#0B1A24" stroke="#F3A25C" stroke-width="2" class="pulse3"/>
      <text x="0" y="256" fill="#8FA3B7" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12">bounded agents -> provenance -> review</text>
    </g>

    <g transform="translate(1000 278)">
      <rect x="0" y="0" width="148" height="96" rx="16" fill="#0A1926" stroke="#2C4256"/>
      <path d="M26 55H48L58 35L76 70L91 47H122" stroke="#5EEAD4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="fastFlow"/>
      <text x="26" y="31" fill="#F6F8FA" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="750">clinical review</text>
      <text x="26" y="81" fill="#71879B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="800" letter-spacing="1.2">AUDITABLE</text>
    </g>

    <g>
      <circle cx="148" cy="255" r="7" fill="#A31F34" filter="url(#softGlow)" class="pulse1"/>
      <circle cx="484" cy="263" r="7" fill="#E25566" filter="url(#softGlow)" class="pulse2"/>
      <circle cx="778" cy="267" r="7" fill="#F3A25C" filter="url(#softGlow)" class="pulse3"/>
      <circle cx="1082" cy="243" r="7" fill="#5EEAD4" filter="url(#softGlow)" class="pulse1"/>
    </g>

    <text x="58" y="474" fill="#536A7F" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" letter-spacing="1.3">DNA  /  CELL STATE  /  TISSUE  /  MODEL  /  UNCERTAINTY  /  GOVERNED CARE</text>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="518.5" rx="23.25" stroke="#263B4E" stroke-width="1.5"/>
</svg>
