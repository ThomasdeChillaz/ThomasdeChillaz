<svg width="1200" height="500" viewBox="0 0 1200 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Thomas de Chillaz - biology and healthcare AI profile</title>
  <desc id="desc">A compact animated profile with a cinematic rotating DNA double helix.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06101D"/>
      <stop offset="0.48" stop-color="#071424"/>
      <stop offset="1" stop-color="#050B14"/>
    </linearGradient>
    <radialGradient id="spot" cx="0" cy="0" r="1" gradientTransform="translate(670 220) rotate(90) scale(260 520)">
      <stop stop-color="#1B3551" stop-opacity="0.55"/>
      <stop offset="0.52" stop-color="#0B1D31" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#050B14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyanRail" x1="0" y1="0" x2="980" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#12283D"/>
      <stop offset="0.28" stop-color="#37C5E6"/>
      <stop offset="0.58" stop-color="#86E8F2"/>
      <stop offset="1" stop-color="#15304A"/>
    </linearGradient>
    <linearGradient id="amberRail" x1="0" y1="0" x2="980" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#211A19"/>
      <stop offset="0.33" stop-color="#FF8A22"/>
      <stop offset="0.7" stop-color="#FFD24A"/>
      <stop offset="1" stop-color="#382416"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#7B92A5"/>
      <stop offset="0.4" stop-color="#1B3048"/>
      <stop offset="1" stop-color="#050B14"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="clip">
      <rect width="1200" height="500" rx="26"/>
    </clipPath>
    <style>
      .helix { transform-origin: 690px 268px; animation: drift 9s ease-in-out infinite; }
      .strandA { stroke-dasharray: 120 760; animation: turnA 5.8s linear infinite; }
      .strandB { stroke-dasharray: 120 760; animation: turnB 5.8s linear infinite; }
      .rung { animation: rungDepth 5.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .rung2 { animation-delay: -1.45s; }
      .rung3 { animation-delay: -2.9s; }
      .rung4 { animation-delay: -4.35s; }
      .base { animation: baseDepth 5.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .base2 { animation-delay: -1.45s; }
      .base3 { animation-delay: -2.9s; }
      .base4 { animation-delay: -4.35s; }
      .trace { stroke-dasharray: 7 13; animation: trace 7s linear infinite; }
      @keyframes turnA {
        0% { stroke-dashoffset: 0; opacity: .75; }
        25% { opacity: 1; }
        50% { stroke-dashoffset: -220; opacity: .58; }
        75% { opacity: 1; }
        100% { stroke-dashoffset: -440; opacity: .75; }
      }
      @keyframes turnB {
        0% { stroke-dashoffset: -220; opacity: .58; }
        25% { opacity: 1; }
        50% { stroke-dashoffset: -440; opacity: .75; }
        75% { opacity: 1; }
        100% { stroke-dashoffset: -660; opacity: .58; }
      }
      @keyframes rungDepth {
        0%,100% { opacity: .45; transform: scaleY(.84); }
        50% { opacity: 1; transform: scaleY(1.08); }
      }
      @keyframes baseDepth {
        0%,100% { opacity: .46; transform: scaleY(.86); }
        50% { opacity: 1; transform: scaleY(1.04); }
      }
      @keyframes drift {
        0%,100% { transform: translate3d(0,0,0) rotate(-1deg); }
        50% { transform: translate3d(0,-8px,0) rotate(1deg); }
      }
      @keyframes trace { to { stroke-dashoffset: -140; } }
      @media (prefers-reduced-motion: reduce) {
        .helix,.strandA,.strandB,.rung,.base,.trace { animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="500" fill="url(#bg)"/>
    <rect width="1200" height="500" fill="url(#spot)"/>
    <rect x="0.75" y="0.75" width="1198.5" height="498.5" rx="25.25" stroke="#263A4D" stroke-width="1.5"/>

