      <text x="2" y="94" fill="#A9B8C7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">biology, oncology, and clinical data systems</text>

      <g transform="translate(0 132)">
        <rect width="386" height="52" rx="10" fill="#0A1724" stroke="#263C50"/>
