      <ellipse cx="192" cy="185" rx="208" ry="118" fill="none" stroke="#25384A" stroke-dasharray="6 12" class="dash"/>

      <path d="M18 185C64 86 130 62 192 116C254 170 320 284 366 185C412 86 478 62 540 116" stroke="#25465A" stroke-width="6" stroke-linecap="round"/>
      <path d="M18 185C64 284 130 308 192 254C254 200 320 86 366 185C412 284 478 308 540 254" stroke="#25465A" stroke-width="6" stroke-linecap="round"/>
      <path d="M18 185C64 86 130 62 192 116C254 170 320 284 366 185C412 86 478 62 540 116" stroke="#5EEAD4" stroke-width="3" stroke-linecap="round" class="dash"/>
      <path d="M18 185C64 284 130 308 192 254C254 200 320 86 366 185C412 284 478 308 540 254" stroke="#E25566" stroke-width="3" stroke-linecap="round" class="dash"/>

      <g stroke="url(#helixLine)" stroke-width="2.4" stroke-linecap="round">
        <path class="rung" d="M45 138L45 232"/>
        <path class="rung2" d="M78 98L78 272"/>
        <path class="rung3" d="M112 83L112 287"/>
        <path class="rung" d="M146 96L146 274"/>
