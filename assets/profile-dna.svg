<svg width="1200" height="500" viewBox="0 0 1200 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Thomas de Chillaz - computational biology profile</title>
  <desc id="desc">A compact animated computational biology profile with a cinematic rotating DNA helix.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06101D"/>
      <stop offset="0.48" stop-color="#071424"/>
      <stop offset="1" stop-color="#050B14"/>
    </linearGradient>
    <radialGradient id="spot" cx="0" cy="0" r="1" gradientTransform="translate(670 220) rotate(90) scale(260 520)">
      <stop stop-color="#1B3551" stop-opacity="0.55"/>
      <stop offset="0.52" stop-color="#0B1D31" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#050B14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyanRail" x1="0" y1="0" x2="980" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#12283D"/>
      <stop offset="0.28" stop-color="#37C5E6"/>
      <stop offset="0.58" stop-color="#86E8F2"/>
      <stop offset="1" stop-color="#15304A"/>
    </linearGradient>
    <linearGradient id="amberRail" x1="0" y1="0" x2="980" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#211A19"/>
      <stop offset="0.33" stop-color="#FF8A22"/>
      <stop offset="0.7" stop-color="#FFD24A"/>
      <stop offset="1" stop-color="#382416"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#7B92A5"/>
      <stop offset="0.4" stop-color="#1B3048"/>
      <stop offset="1" stop-color="#050B14"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="clip">
      <rect width="1200" height="500" rx="26"/>
    </clipPath>
    <style>
      .helix { transform-origin: 690px 268px; animation: drift 9s ease-in-out infinite; }
      .strandA { stroke-dasharray: 82 980; animation: turnA 5.8s linear infinite; }
      .strandB { stroke-dasharray: 82 980; animation: turnB 5.8s linear infinite; }
      .shadowA { stroke-dasharray: 82 980; animation: turnA 5.8s linear infinite; }
      .shadowB { stroke-dasharray: 82 980; animation: turnB 5.8s linear infinite; }
      .ring { animation: ringPulse 5.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .ring2 { animation-delay: -1.45s; }
      .ring3 { animation-delay: -2.9s; }
      .ring4 { animation-delay: -4.35s; }
      .rung { animation: rungDepth 5.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .rung2 { animation-delay: -1.45s; }
      .rung3 { animation-delay: -2.9s; }
      .rung4 { animation-delay: -4.35s; }
      .trace { stroke-dasharray: 7 13; animation: trace 7s linear infinite; }
      @keyframes turnA {
        0% { stroke-dashoffset: 0; opacity: .75; }
        25% { opacity: 1; }
        50% { stroke-dashoffset: -245; opacity: .45; }
        75% { opacity: 1; }
        100% { stroke-dashoffset: -490; opacity: .75; }
      }
      @keyframes turnB {
        0% { stroke-dashoffset: -245; opacity: .45; }
        25% { opacity: 1; }
        50% { stroke-dashoffset: -490; opacity: .75; }
        75% { opacity: 1; }
        100% { stroke-dashoffset: -735; opacity: .45; }
      }
      @keyframes ringPulse {
        0%,100% { opacity: .58; transform: scale(.86); }
        50% { opacity: 1; transform: scale(1.08); }
      }
      @keyframes rungDepth {
        0%,100% { opacity: .45; transform: scaleY(.84); }
        50% { opacity: 1; transform: scaleY(1.08); }
      }
      @keyframes drift {
        0%,100% { transform: translate3d(0,0,0) rotate(-1deg); }
        50% { transform: translate3d(0,-8px,0) rotate(1deg); }
      }
      @keyframes trace { to { stroke-dashoffset: -140; } }
      @media (prefers-reduced-motion: reduce) {
        .helix,.strandA,.strandB,.shadowA,.shadowB,.ring,.rung,.trace { animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="500" fill="url(#bg)"/>
    <rect width="1200" height="500" fill="url(#spot)"/>
    <rect x="0.75" y="0.75" width="1198.5" height="498.5" rx="25.25" stroke="#263A4D" stroke-width="1.5"/>

    <g opacity="0.09">
      <path d="M72 95H1128M72 155H1128M72 215H1128M72 275H1128M72 335H1128M72 395H1128" stroke="#B8CAD8"/>
      <path d="M135 62V438M235 62V438M335 62V438M435 62V438M535 62V438M635 62V438M735 62V438M835 62V438M935 62V438M1035 62V438" stroke="#B8CAD8"/>
    </g>

    <g transform="translate(72 72)">
      <rect width="226" height="29" rx="14.5" fill="#101D2A" stroke="#2C475E"/>
      <circle cx="19" cy="14.5" r="4.2" fill="#37C5E6" filter="url(#softGlow)"/>
      <text x="34" y="19.8" fill="#E8F2F8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="780" letter-spacing="1.7">COMPUTATIONAL BIOLOGY</text>

      <text x="0" y="92" fill="#F7FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="48" font-weight="800">Thomas de Chillaz</text>
      <text x="2" y="130" fill="#A9B8C7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">biology, oncology, and clinical data systems</text>

      <g transform="translate(0 168)">
        <rect width="386" height="52" rx="10" fill="#0A1724" stroke="#263C50"/>
        <rect width="5" height="52" rx="2.5" fill="#FF8A22"/>
        <text x="22" y="23" fill="#F2F7FA" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" letter-spacing="1.2">MIT CSAIL / KELLIS LAB</text>
        <text x="22" y="42" fill="#8FA1B1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">computational biology research systems</text>
      </g>

      <g transform="translate(0 234)">
        <rect width="386" height="52" rx="10" fill="#0A1724" stroke="#263C50"/>
        <rect width="5" height="52" rx="2.5" fill="#37C5E6"/>
        <text x="22" y="23" fill="#F2F7FA" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" letter-spacing="1.2">AIDAMS / CENTRALESUPELEC X ESSEC</text>
        <text x="22" y="42" fill="#8FA1B1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">AI, data, and management</text>
      </g>

      <g transform="translate(0 334)">
        <text x="0" y="0" fill="#37C5E6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="800" letter-spacing="1.5">FOCUS</text>
        <text x="0" y="29" fill="#D8E3EA" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">single-cell evaluation</text>
        <text x="190" y="29" fill="#D8E3EA" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">multimodal oncology</text>
        <text x="0" y="57" fill="#D8E3EA" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">dynamic biological maps</text>
        <text x="190" y="57" fill="#D8E3EA" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">governed health AI</text>
      </g>
    </g>

    <g class="helix">
      <path d="M480 258C555 148 638 118 718 188C798 258 882 376 958 258C1034 140 1110 126 1174 190" stroke="#07101A" stroke-width="31" stroke-linecap="round" opacity=".42"/>
      <path d="M480 258C555 368 638 398 718 328C798 258 882 140 958 258C1034 376 1110 390 1174 326" stroke="#07101A" stroke-width="31" stroke-linecap="round" opacity=".42"/>
      <path d="M480 258C555 148 638 118 718 188C798 258 882 376 958 258C1034 140 1110 126 1174 190" stroke="#152A3D" stroke-width="22" stroke-linecap="round"/>
      <path d="M480 258C555 368 638 398 718 328C798 258 882 140 958 258C1034 376 1110 390 1174 326" stroke="#152A3D" stroke-width="22" stroke-linecap="round"/>
      <path class="shadowA" d="M480 258C555 148 638 118 718 188C798 258 882 376 958 258C1034 140 1110 126 1174 190" stroke="#06101B" stroke-width="26" stroke-linecap="round" opacity=".78"/>
      <path class="shadowB" d="M480 258C555 368 638 398 718 328C798 258 882 140 958 258C1034 376 1110 390 1174 326" stroke="#06101B" stroke-width="26" stroke-linecap="round" opacity=".78"/>
      <path class="strandA" d="M480 258C555 148 638 118 718 188C798 258 882 376 958 258C1034 140 1110 126 1174 190" stroke="url(#cyanRail)" stroke-width="10" stroke-linecap="round" filter="url(#softGlow)"/>
      <path class="strandB" d="M480 258C555 368 638 398 718 328C798 258 882 140 958 258C1034 376 1110 390 1174 326" stroke="url(#amberRail)" stroke-width="10" stroke-linecap="round" filter="url(#softGlow)"/>

      <g stroke="url(#metal)" stroke-width="5.5" stroke-linecap="round">
        <path class="rung" d="M524 199L524 317"/>
        <path class="rung rung2" d="M569 154L569 362"/>
        <path class="rung rung3" d="M614 132L614 384"/>
        <path class="rung rung4" d="M659 147L659 369"/>
        <path class="rung" d="M704 178L704 338"/>
        <path class="rung rung2" d="M749 214L749 302"/>
        <path class="rung rung3" d="M794 250L794 266"/>
        <path class="rung rung4" d="M839 303L839 213"/>
        <path class="rung" d="M884 358L884 158"/>
        <path class="rung rung2" d="M929 383L929 133"/>
        <path class="rung rung3" d="M974 363L974 153"/>
        <path class="rung rung4" d="M1019 314L1019 202"/>
        <path class="rung" d="M1064 270L1064 246"/>
        <path class="rung rung2" d="M1109 231L1109 285"/>
      </g>

      <g fill="none" stroke-width="4" filter="url(#softGlow)">
        <circle class="ring" cx="524" cy="199" r="9" stroke="#FFD24A"/>
        <circle class="ring ring2" cx="569" cy="362" r="9" stroke="#FF8A22"/>
        <circle class="ring ring3" cx="614" cy="132" r="8" stroke="#37C5E6"/>
        <circle class="ring ring4" cx="659" cy="369" r="9" stroke="#FFD24A"/>
        <circle class="ring" cx="704" cy="178" r="8" stroke="#37C5E6"/>
        <circle class="ring ring2" cx="749" cy="302" r="8" stroke="#FF8A22"/>
        <circle class="ring ring3" cx="884" cy="358" r="9" stroke="#FFD24A"/>
        <circle class="ring ring4" cx="929" cy="133" r="8" stroke="#37C5E6"/>
        <circle class="ring" cx="1019" cy="314" r="8" stroke="#FF8A22"/>
        <circle class="ring ring2" cx="1109" cy="231" r="8" stroke="#37C5E6"/>
      </g>
    </g>

    <g transform="translate(480 438)">
      <rect width="650" height="32" rx="16" fill="#071422" fill-opacity=".68" stroke="#263C50"/>
      <text x="24" y="21" fill="#FFD24A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="800" letter-spacing="1.4">STACK</text>
      <text x="92" y="21" fill="#D8E3EA" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12">Python / PyTorch / Scanpy / AnnData / TypeScript / FHIR R4</text>
    </g>

    <path class="trace" d="M480 420H1130" stroke="#2C5670" stroke-width="1.4" opacity=".75"/>
    <path d="M480 420H1130" stroke="#07101A" stroke-width="5" opacity=".28"/>
  </g>
</svg>
