        <text x="22" y="23" fill="#F2F7FA" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" letter-spacing="1.2">AIDAMS / CENTRALESUPELEC X ESSEC</text>
        <text x="22" y="42" fill="#8FA1B1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">AI, data, and management</text>
      </g>

      <g transform="translate(0 298)">
        <text x="0" y="0" fill="#37C5E6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="800" letter-spacing="1.5">FOCUS</text>
        <text x="0" y="29" fill="#D8E3EA" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">single-cell evaluation</text>
        <text x="190" y="29" fill="#D8E3EA" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">multimodal oncology</text>
        <text x="0" y="57" fill="#D8E3EA" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">dynamic biological maps</text>
        <text x="190" y="57" fill="#D8E3EA" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">governed health AI</text>
      </g>
    </g>

