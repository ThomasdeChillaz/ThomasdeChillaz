<svg width="1200" height="238" viewBox="0 0 1200 238" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Research at MIT CSAIL with the Kellis Lab</title>
  <desc id="desc">A clean research card highlighting computational biology, single-cell evaluation, and translational systems.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1200" y2="238" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1521"/>
      <stop offset="1" stop-color="#0E1D2C"/>
    </linearGradient>
    <linearGradient id="line" x1="36" y1="0" x2="1164" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A31F34"/>
      <stop offset="0.5" stop-color="#E25566"/>
      <stop offset="1" stop-color="#5EEAD4"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4"/></filter>
    <style>
      .dash { stroke-dasharray: 5 10; animation: dash 7s linear infinite; }
      .p1 { animation: p 3s ease-in-out infinite; }
      .p2 { animation: p 3s ease-in-out -1s infinite; }
      .p3 { animation: p 3s ease-in-out -2s infinite; }
      @keyframes dash { to { stroke-dashoffset:-90; } }
      @keyframes p { 0%,100% { opacity:.35; } 50% { opacity:1; } }
      @media (prefers-reduced-motion: reduce) { .dash,.p1,.p2,.p3 { animation:none; } }
    </style>
  </defs>

  <rect x="0.75" y="0.75" width="1198.5" height="236.5" rx="22.25" fill="url(#card)" stroke="#273C50" stroke-width="1.5"/>
  <rect x="31" y="30" width="6" height="178" rx="3" fill="#A31F34"/>

  <text x="64" y="63" fill="#E25566" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" letter-spacing="2.1">RESEARCH @ MIT CSAIL</text>
  <text x="64" y="105" fill="#F5F7FA" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="750">Kellis Lab · Computational Biology</text>
  <text x="64" y="137" fill="#A3B4C5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Building rigorous systems for biological representation, evaluation, and translation.</text>
  <text x="64" y="177" fill="#73899D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="1.25">CENTRALESUPÉLEC × ESSEC  /  AIDAMS  /  FRENCH-AMERICAN</text>

  <path d="M688 119H1132" stroke="#2C4256" stroke-width="2"/>
  <path d="M688 119H1132" stroke="url(#line)" stroke-width="2" class="dash"/>

  <g>
    <circle cx="720" cy="119" r="24" fill="#101F2E" stroke="#A31F34" stroke-width="2"/>
    <circle cx="720" cy="119" r="6" fill="#E25566" class="p1"/>
    <text x="720" y="167" text-anchor="middle" fill="#F3F6F8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">BIOLOGY</text>
    <text x="720" y="188" text-anchor="middle" fill="#71879B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">questions + data</text>
  </g>

  <g>
    <circle cx="910" cy="119" r="24" fill="#101F2E" stroke="#7C5160" stroke-width="2"/>
    <path d="M900 119H920M910 109V129" stroke="#E28B98" stroke-width="2" stroke-linecap="round" class="p2"/>
    <text x="910" y="167" text-anchor="middle" fill="#F3F6F8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">EVALUATION</text>
    <text x="910" y="188" text-anchor="middle" fill="#71879B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">splits + metrics</text>
  </g>

  <g>
    <circle cx="1100" cy="119" r="24" fill="#101F2E" stroke="#5EEAD4" stroke-width="2"/>
    <path d="M1089 124L1097 132L1112 106" stroke="#5EEAD4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="p3"/>
    <text x="1100" y="167" text-anchor="middle" fill="#F3F6F8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">TRANSLATION</text>
    <text x="1100" y="188" text-anchor="middle" fill="#71879B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">reviewable systems</text>
  </g>

  <circle cx="720" cy="119" r="31" fill="#A31F34" fill-opacity="0.08" filter="url(#glow)"/>
  <circle cx="910" cy="119" r="31" fill="#E25566" fill-opacity="0.06" filter="url(#glow)"/>
  <circle cx="1100" cy="119" r="31" fill="#5EEAD4" fill-opacity="0.07" filter="url(#glow)"/>
</svg>
