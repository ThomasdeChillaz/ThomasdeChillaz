<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Thomas de Chillaz - computational biology profile</title>
  <desc id="desc">A compact static computational biology profile card with DNA, single-cell analysis, oncology, and healthcare data systems.</desc>
  <defs>
