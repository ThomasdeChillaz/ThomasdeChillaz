name: Update PR activity

on:
  push:
    branches: [main]
    paths-ignore:
      - assets/pr-activity.svg
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: profile-pr-activity
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Generate animated PR panel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
          GITHUB_GRAPHQL_URL: ${{ github.graphql_url }}
        run: python scripts/generate_pr_activity.py --output assets/pr-activity.svg

      - name: Commit updated panel
        shell: bash
        run: |
          if git diff --quiet -- assets/pr-activity.svg; then
            echo "PR panel is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pr-activity.svg
          git commit -m "chore: refresh pull-request activity [skip ci]"
          git push
