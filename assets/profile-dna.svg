      <stop stop-color="#071017"/>
      <stop offset="0.55" stop-color="#0B141B"/>
      <stop offset="1" stop-color="#101417"/>
    </linearGradient>
    <linearGradient id="dnaA" x1="410" y1="0" x2="920" y2="0" gradientUnits="userSpaceOnUse">
