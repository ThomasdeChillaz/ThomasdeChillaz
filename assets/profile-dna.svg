      <text x="0" y="39" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="820">Research systems for biology</text>
      <text x="0" y="69" fill="#9CADBE" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">From biological signal to validated</text>
      <text x="0" y="91" fill="#9CADBE" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">representation to governed use.</text>

      <rect x="0" y="128" width="262" height="1" fill="#304254"/>
      <rect x="0" y="127" width="72" height="3" rx="1.5" fill="url(#redCyan)" class="scan"/>

      <text x="0" y="168" fill="#5EEAD4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="850" letter-spacing="1.7">STACK</text>
      <text x="0" y="199" fill="#F0F5FA" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13">Python  PyTorch  Scanpy</text>
